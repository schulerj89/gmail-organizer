name: Feature request
description: Propose a focused improvement to Gmail Organizer
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What inbox-cleanup or review problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the smallest useful version of the change.
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: Privacy and safety considerations
      description: Explain any impact on Gmail scopes, data sent to AI, destructive actions, secrets, or local storage.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be interested in helping implement or test this.
